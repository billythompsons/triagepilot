<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
<rect width="1240" height="760" fill="#0e1526"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#5aa2ff"/></marker></defs>
<text x="40" y="52" fill="#e8eefc" font-size="26" font-weight="800" font-family="sans-serif">Triagepilot — architecture</text>
<text x="40" y="78" fill="#93a1c0" font-size="14" font-family="sans-serif">Strands Agents SDK · model-agnostic · dry-run safe by default</text>
<rect x="40" y="120" width="210" height="150" rx="12" fill="#16233f" stroke="#5aa2ff" stroke-width="1.5"/>
<text x="145.0" y="150" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">CLI</text>
<text x="145.0" y="176" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">triagepilot triage</text>
<text x="145.0" y="197" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">OWNER/REPO --limit N</text>
<text x="145.0" y="218" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">--apply (opt-in writes)</text>
<text x="145.0" y="239" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">triagepilot demo</text>
<rect x="40" y="300" width="210" height="150" rx="12" fill="#16233f" stroke="#9d7bff" stroke-width="1.5"/>
<text x="145.0" y="330" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">config.py</text>
<text x="145.0" y="356" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">TRIAGEPILOT_PROVIDER</text>
<text x="145.0" y="377" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">ollama · openrouter · demo</text>
<text x="145.0" y="398" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">GITHUB_TOKEN (optional)</text>
<text x="145.0" y="419" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">.env.example</text>
<rect x="330" y="180" width="320" height="270" rx="12" fill="#1d3a5f" stroke="#5aa2ff" stroke-width="1.5"/>
<text x="490.0" y="210" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">Strands Agent</text>
<text x="490.0" y="236" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">agent.py — Agent(model, tools,</text>
<text x="490.0" y="257" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">  system_prompt)</text>
<text x="490.0" y="278" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif"></text>
<text x="490.0" y="299" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">system prompt: expert OSS</text>
<text x="490.0" y="320" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">maintainer triage workflow</text>
<text x="490.0" y="341" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif"></text>
<text x="490.0" y="362" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">event loop: reason → act →</text>
<text x="490.0" y="383" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">observe → report</text>
<rect x="730" y="120" width="220" height="150" rx="12" fill="#16233f" stroke="#4cc38a" stroke-width="1.5"/>
<text x="840.0" y="150" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">Model providers</text>
<text x="840.0" y="176" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">ollama/qwen2.5 — local, $0</text>
<text x="840.0" y="197" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">openrouter/* — via LiteLLM</text>
<text x="840.0" y="218" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">demo — scripted policy</text>
<text x="840.0" y="239" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">(offline, deterministic)</text>
<rect x="730" y="300" width="220" height="200" rx="12" fill="#16233f" stroke="#5aa2ff" stroke-width="1.5"/>
<text x="840.0" y="330" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">6 GitHub tools</text>
<text x="840.0" y="356" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">fetch_open_issues</text>
<text x="840.0" y="377" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">fetch_issue (+comments)</text>
<text x="840.0" y="398" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">list_repo_labels</text>
<text x="840.0" y="419" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">search_similar_issues</text>
<text x="840.0" y="440" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">apply_labels  ⚠ gated</text>
<text x="840.0" y="461" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">post_comment  ⚠ gated</text>
<rect x="330" y="510" width="320" height="130" rx="12" fill="#3f2d1d" stroke="#c98a4b" stroke-width="1.5"/>
<text x="490.0" y="540" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">Data</text>
<text x="490.0" y="566" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">GitHub REST API (urllib)</text>
<text x="490.0" y="587" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">fixtures/demo_issues.json</text>
<text x="490.0" y="608" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">in demo mode — no network</text>
<rect x="1000" y="180" width="200" height="200" rx="12" fill="#16233f" stroke="#4cc38a" stroke-width="1.5"/>
<text x="1100.0" y="210" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">Output</text>
<text x="1100.0" y="236" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">triage report (.md)</text>
<text x="1100.0" y="257" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">table: # · category</text>
<text x="1100.0" y="278" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">labels · priority · action</text>
<text x="1100.0" y="299" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">per-issue draft reply</text>
<text x="1100.0" y="320" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif"></text>
<text x="1100.0" y="341" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">dry-run note</text>
<rect x="1000" y="420" width="200" height="130" rx="12" fill="#2d1d1d" stroke="#e06c6c" stroke-width="1.5"/>
<text x="1100.0" y="450" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="700" font-family="sans-serif">Safety gate</text>
<text x="1100.0" y="476" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">writes need BOTH:</text>
<text x="1100.0" y="497" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">TRIAGEPILOT_APPLY=1</text>
<text x="1100.0" y="518" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">and GITHUB_TOKEN</text>
<text x="1100.0" y="539" text-anchor="middle" fill="#93a1c0" font-size="13" font-family="sans-serif">else: dry-run only</text>
