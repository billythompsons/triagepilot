[project]
name = "triagepilot"
version = "0.1.0"
description = "An AI maintainer that triages your GitHub issues — built with the Strands Agents SDK."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jonathan Willis", email = "instinctaiapp@gmail.com" }]
dependencies = [
    "strands-agents>=1.0.0",
    "litellm>=1.70.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
triagepilot = "triagepilot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
